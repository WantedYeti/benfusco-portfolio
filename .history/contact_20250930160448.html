      <div class="navbar-divider">
        <svg height="1" width="100%" style="display:block;"><line x1="0" y1="0" x2="100%" y2="0" style="stroke:#fff;stroke-width:1;opacity:0.25;"></line></svg>
      </div>
      <ul class="nav-root">
        <li><a href="index.html#about" class="nav-link">About</a></li>

  <main class="section contact">
    <h1>Contact</h1>
    <p style="text-align:center; opacity:.8; margin:-6px 0 20px;">Ready to connect?</p>
    <form action="mailto:youremail@example.com" method="POST" enctype="text/plain" style="max-width:520px; margin:0 auto;">
      <input type="text" name="name" placeholder="Your Name" required>
      <input type="email" name="email" placeholder="Your Email" required>
      <textarea name="message" rows="6" placeholder="Your Message" required></textarea>
      <button type="submit">Send Message</button>
    </form>
  </main>
