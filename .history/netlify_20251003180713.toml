[build]
  publish = "."

# Optional: enable form submissions without JS. Netlify auto-detects forms in your HTML.
# No build command needed for a static site.

# Ensure form submissions are processed server-side
[[headers]]
  for = "/"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "no-referrer-when-downgrade"

# Inline confirmation in contact page; no thank-you.html needed

# Safety: redirect old thank-you URL back to contact page
[[redirects]]
  from = "/thank-you.html"
  to = "/contact.html"
  status = 301
  force = false
