<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Thank You | Ben Fusco</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    body { font-family: 'Montserrat', sans-serif; color:#2f3338; }
    .wrap { min-height: 100dvh; display:flex; align-items:center; justify-content:center; padding:48px 16px; }
    .card { max-width: 720px; margin:0 auto; text-align:center; }
    .title { font-family: 'Cormorant Garamond', serif; font-weight:500; letter-spacing:2px; text-transform:uppercase; font-size: clamp(28px, 4vw, 40px); color:#98A0AB; margin:0 0 10px; }
    .lead { color:#5d6269; line-height:1.7; margin:0 0 22px; }
    .btn { display:inline-block; padding:12px 22px; border:1px solid #CFD4DB; color:#5E646B; text-decoration:none; letter-spacing:2px; font-size:12px; text-transform:uppercase; }
    .btn:hover { background:#F5F7FA; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1 class="title">Thank you</h1>
      <p class="lead">Your message has been received. I’ll review it and get back to you soon. If this is time-sensitive, feel free to reach me directly at <a href="mailto:contact@benfusco.com">contact@benfusco.com</a>.</p>
      <a class="btn" href="index.html">Back to Home</a>
    </div>
  </div>
</body>
</html>
